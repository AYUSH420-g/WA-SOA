# Render Blueprint Specification for Lab 7 Cloud Deployment
# Automatically provisions the API Gateway and microservices on Render.com
services:
  # ----------------------------------------------------------------------------
  # 1. API Gateway (Public-Facing Entry Point)
  # ----------------------------------------------------------------------------
  - type: web
    name: campusconnect-api-gateway
    env: docker
    dockerfilePath: ./api-gateway/Dockerfile
    dockerContext: ./api-gateway
    plan: free
    region: oregon
    envVars:
      - key: PORT
        value: 8080
      - key: USER_SERVICE_URL
        fromService:
          type: web
          name: campusconnect-user-service
          property: host
      - key: PRODUCT_SERVICE_URL
        fromService:
          type: web
          name: campusconnect-product-service
          property: host
      - key: ORDER_SERVICE_URL
        fromService:
          type: web
          name: campusconnect-order-service
          property: host

  # ----------------------------------------------------------------------------
  # 2. User Service
  # ----------------------------------------------------------------------------
  - type: web
    name: campusconnect-user-service
    env: docker
    dockerfilePath: ./user-service/Dockerfile
    dockerContext: ./user-service
    plan: free
    region: oregon
    envVars:
      - key: PORT
        value: 3001
      - key: USER_SERVICE_PORT
        value: 3001
      - key: MONGODB_URI
        sync: false

  # ----------------------------------------------------------------------------
  # 3. Product Service
  # ----------------------------------------------------------------------------
  - type: web
    name: campusconnect-product-service
    env: docker
    dockerfilePath: ./product-service/Dockerfile
    dockerContext: ./product-service
    plan: free
    region: oregon
    envVars:
      - key: PORT
        value: 3002
      - key: PRODUCT_SERVICE_PORT
        value: 3002
      - key: MONGODB_URI
        sync: false

  # ----------------------------------------------------------------------------
  # 4. Order Service
  # ----------------------------------------------------------------------------
  - type: web
    name: campusconnect-order-service
    env: docker
    dockerfilePath: ./order-service/Dockerfile
    dockerContext: ./order-service
    plan: free
    region: oregon
    envVars:
      - key: PORT
        value: 3003
      - key: ORDER_SERVICE_PORT
        value: 3003
      - key: USER_SERVICE_URL
        fromService:
          type: web
          name: campusconnect-user-service
          property: host
      - key: PRODUCT_SERVICE_URL
        fromService:
          type: web
          name: campusconnect-product-service
          property: host
      - key: REQUEST_TIMEOUT_MS
        value: 5000
      - key: MONGODB_URI
        sync: false
